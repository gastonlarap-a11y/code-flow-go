version: "3"

# The developer loop and the release build, in one place.
#
# Run with `wails3 task <name>` (the CLI bundles go-task) or a standalone `task <name>`.
#
# Two things here are load-bearing rather than convenience:
#
#   - MACOSX_DEPLOYMENT_TARGET and the matching CGO flags. Wails links against the system WebKit
#     through cgo; without them the linker warns on every object and the produced binary claims to
#     support macOS 11, which it does not. 26.0 is the minimum this project supports (see README).
#   - VITE_PORT stays 1420. The renderer's vite.config.ts fixes the port with strictPort, so
#     changing it here would make `dev` load someone else's server or nothing at all.

# The generated Wails build assets, which own packaging and nothing else.
#
# `wails3 generate build-assets` writes build/Taskfile.yml plus one per platform, and they bring
# their own `build`, `dev` and dependency-install tasks. Those are **not** included: the ones above
# are hand-written because three things in them are load-bearing (the deployment target, the fixed
# Vite port, the ldflags version) and a regenerated file would silently drop them. Only the
# packaging namespaces are pulled in, which is all `darwin:package` and `windows:package` need.
includes:
  darwin:
    taskfile: ./build/darwin/Taskfile.yml
    dir: .
    optional: true
  windows:
    taskfile: ./build/windows/Taskfile.yml
    dir: .
    optional: true

vars:
  APP_NAME: CodeFlow
  BIN_DIR: bin
  # `go build -o <name>` writes exactly `<name>`: unlike a bare `go build`, an explicit output path
  # gets no `.exe` added on Windows. So the binary was called `CodeFlow`, while `package:win` and
  # the release workflow's smoke test both looked for `CodeFlow.exe` — the installer step failed on
  # a file that had never been written under that name.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  # The single source of truth for the version at build time. The CI gate additionally requires
  # build/config.yml and frontend/package.json to agree with it.
  VERSION: '{{.VERSION | default "0.0.0"}}'
  MACOS_MIN: "26.0"

env:
  VITE_PORT: 1420
  # Applies to every task, not just `build`: `go test` links the Wails package too, and without
  # these the linker warns on every object of every run. They are a no-op off macOS.
  MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN}}"
  CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN}}"
  CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN}}"

tasks:
  default:
    cmds:
      - task: build

  # ---- frontend ---------------------------------------------------------------------------

  frontend:install:
    desc: Install renderer dependencies exactly as locked.
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile

  frontend:build:
    desc: Build the renderer into frontend/dist, which main.go embeds.
    dir: frontend
    cmds:
      - pnpm build
      # Vite empties outDir, which deletes the tracked placeholder that keeps
      # `//go:embed all:frontend/dist` compiling on a clean clone. Restoring it here rather than
      # turning off emptyOutDir, because stale hashed chunks accumulating in a desktop build is
      # the worse trade: `lazyRetry` exists precisely because the renderer once asked for chunks
      # that were no longer there.
      - cmd: git checkout -- dist/.gitkeep 2>/dev/null || printf 'Placeholder for go:embed; see .gitignore.\n' > dist/.gitkeep
        ignore_error: true

  frontend:check:
    desc: Typecheck and test the renderer.
    dir: frontend
    cmds:
      - pnpm typecheck
      - pnpm test
      # `pnpm lint` is deliberately absent. typescript-eslint refuses to load against TypeScript 7
      # ("typescript-eslint does not support TS 7.0"); its tracking issue targets TS >= 7.1. The
      # ESLint config is kept intact so this becomes one line again the day support lands.
      # See README, "Known gaps".

  # ---- backend ----------------------------------------------------------------------------

  go:check:
    desc: Vet, lint and test the Go code.
    cmds:
      - go vet ./...
      - golangci-lint run
      - task: go:lint:other-platform
      - go test -race -count=1 ./...
      - task: go:no-bare-goroutines
      - task: go:vuln

  go:vuln:
    desc: Report known vulnerabilities this code actually reaches.
    # Through `go run …@version` rather than a `tool` directive: that would add the scanner's own
    # dependencies to go.mod for a program the app never links. Same version as CI's
    # GOVULNCHECK_VERSION.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  go:lint:other-platform:
    desc: Lint the build-tagged files the host platform never compiles.
    # `golangci-lint run` only ever sees the files that build for GOOS. The process-group and
    # Job Object code is split exactly along that line, so `group_windows.go` was never linted on
    # a Mac and `group_unix.go` is never linted on Windows — and three real gosec findings lived
    # in the Windows half until CI compiled it for the first time. This closes that half of the
    # gate locally, where it is cheap, instead of leaving it to a runner.
    #
    # Vet and test still run for the host only: cross-compiling is a build, not an execution.
    #
    # macOS to Windows only, and not for symmetry: `keychain_darwin.go` binds the macOS Security
    # framework through cgo, so type-checking it from Windows fails on the binding rather than on
    # anything here. A developer on Windows loses nothing — CI's macOS job lints those files
    # natively, which is the stronger check.
    cmds:
      - cmd: |
          if [ "$(go env GOOS)" = "windows" ]; then
            echo "skipped: linting darwin from Windows needs a macOS C toolchain for the keychain binding"
          else
            GOOS=windows GOARCH=amd64 golangci-lint run
          fi

  go:no-bare-goroutines:
    desc: Fail on a `go` statement outside shared/safego (BOOT-035).
    # An unrecovered panic on any goroutine ends the whole process, taking every terminal, AI run
    # and stream with it. safego.Go is the only sanctioned spelling, which only works if it is
    # mechanically enforced. Inverted grep: a match is a failure.
    cmds:
      # Written as a capture with an explicit final status rather than as `if grep …; then fail; fi`.
      # go-task runs this through its own shell, which answers an `if` whose condition was false —
      # and a `grep` that matched nothing *is* false — with that condition's exit code. So the
      # obvious spelling failed the task every time the repository passed, while CI ran the same
      # test under bash, where it does not. A green CI and a red `task check` disagreeing about the
      # same rule is worse than not having the rule locally at all.
      - |
        bare=$(grep -rnE '^[[:space:]]*go (func|[a-zA-Z_.]+\()' backend --include='*.go' \
                 | grep -v '_test.go' | grep -v 'shared/safego' || true)
        if [ -n "$bare" ]; then
          echo "$bare"
          echo "error: start goroutines through shared/safego.Go (see backend/shared/safego)" >&2
          exit 1
        fi
        exit 0

  # ---- build ------------------------------------------------------------------------------

  build:
    desc: Build the application binary with the renderer embedded.
    deps: [frontend:build]
    # `-s -w` drops the symbol table and DWARF: 11 MB of the 65, on every download and every disk,
    # for nothing this application uses. Go's tracebacks come from pclntab, which survives — the
    # panic traces `safego` recovers and writes to errors.log still name the function, the file and
    # the line, byte for byte identical to an unstripped build (measured, not assumed). What is
    # lost is attaching a debugger to a *release* binary, which is not how this is debugged.
    cmds:
      - go build -trimpath -mod=readonly -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}}{{.EXE}} .

  dev:
    desc: Run the app with hot reload (Go rebuild + Vite on 1420).
    # `wails3 dev` runs the three `dev:*` tasks below, as listed under `dev_mode.executes` in
    # build/config.yml. `-port` is what it exports as FRONTEND_DEVSERVER_URL, the address the dev
    # build loads the renderer from, so it must be Vite's fixed port rather than Wails' default 9245.
    cmds:
      - wails3 dev -config ./build/config.yml -port $VITE_PORT

  dev:build:
    internal: true
    # No `-s -w` and inlining off (`-l`), so a debugger can attach; no `-X main.version`, so the
    # build reports 0.0.0 and the updater never offers to replace a development binary. The
    # renderer is not built: the dev binary loads it from Vite, and `frontend/dist` only has to
    # hold the placeholder that keeps `go:embed` compiling.
    cmds:
      - go build -buildvcs=false -gcflags=all=-l -o {{.BIN_DIR}}/{{.APP_NAME}}-dev{{.EXE}} .

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - pnpm dev

  dev:run:
    internal: true
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}-dev{{.EXE}}"

  smoke:
    desc: Run the packaged binary's own environment probes.
    deps: [build]
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}{{.EXE}} --smoke-test"

  # ---- packaging (§10.3) ------------------------------------------------------------------
  #
  # These wrap `build` above rather than the generated `darwin:build` / `windows:build`, and that
  # is the whole point of their existing: the generated build tasks do not carry
  # `-X main.version`, so an .app made from one would report `0.0.0` to the updater and offer
  # itself as an update forever.

  package:mac:
    desc: Build bin/CodeFlow.app (arm64, ad-hoc signed).
    deps: [build]
    cmds:
      - task: darwin:create:app:bundle
      # `wails3 generate build-assets` writes `build/darwin/Assets.car` from **its own** icon — the
      # catalog holds `appicon_Assets/wails_icon_vector`, the Wails logo — and `create:app:bundle`
      # copies it in. macOS resolves an app icon from the asset catalog **before** the
      # `CFBundleIconFile` in Info.plist, so the bundle showed a W however correct `icons.icns` was.
      #
      # Removed rather than regenerated: there is no CodeFlow `.icon` source to build a catalog
      # from, and 2.7.1 shipped an `.icns` and nothing else. `wails3 generate icons` rewrites the
      # `.icns` from `build/appicon.png` but leaves the catalog untouched, which is how this
      # survived a regeneration.
      #
      # After the bundle is built and therefore after it was signed, so the signature is renewed.
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/Assets.car"
      # The version the binary reports (`-X main.version`) and the one the bundle declares are two
      # different facts, and only the first was ever set: build/darwin/Info.plist carried a literal
      # version, so every release from 3.0.0 to 3.3.0 shipped a bundle whose Get Info said 3.0.0.
      # Nothing in Go reads CFBundle*, so this changes no contract — it changes what macOS and the
      # user are told, which matters most on an unnotarized build the system has just refused.
      #
      # On the copy inside the bundle, never on build/darwin/Info.plist, and **before** the signing
      # below: the plist is sealed by the signature, so editing it afterwards invalidates it.
      - /usr/libexec/PlistBuddy -c "Set :CFBundleVersion {{.VERSION}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString {{.VERSION}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  package:mac:dmg:
    desc: Build the published disk image, CodeFlow-{{.VERSION}}-arm64.dmg.
    deps: [package:mac]
    cmds:
      - task: darwin:create:dmg
      # wails3 names it after the app; the published name is what 2.7.x's updater selects on
      # (§5.5), so it is renamed here rather than hoped for.
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.dmg" "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-arm64.dmg"
      - cd {{.BIN_DIR}} && shasum -a 256 "{{.APP_NAME}}-{{.VERSION}}-arm64.dmg" > "{{.APP_NAME}}-{{.VERSION}}-arm64.dmg.sha256"

  package:win:
    desc: Build the NSIS installer and the portable build, with their digests.
    deps: [build]
    cmds:
      - wails3 generate webview2bootstrapper -dir build/windows/nsis
      # Run from the script's own directory, which the generated `build/windows/Taskfile.yml` also
      # does, because `project.nsi` opens with `OutFile "..\..\..\bin\..."` — three levels up from
      # *there*. Invoked from the repository root it would write three levels above the repository.
      #
      # The binary's path is absolute and backslashed: `ROOT_DIR` on Windows already uses
      # backslashes, and appending `/bin/...` produced `D:\a\repo/bin/CodeFlow.exe`, which NSIS
      # answered with `File: ... -> no files found` for a file that was right there. It is quoted
      # because go-task runs commands through a POSIX shell, where an unquoted `\` escapes the next
      # character — that is what turned `build\windows\nsis\project.nsi` into
      # `buildwindowsnsisproject.nsi`.
      - >-
        cd build/windows/nsis &&
        makensis -V3 -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe"
        -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user
        project.nsi
      # `-Setup-` is not cosmetic: it is how 2.7.x tells the installer from the portable build, and
      # handing over the portable one updates nothing (BOOT-021).
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}-amd64-installer.exe" "{{.BIN_DIR}}/{{.APP_NAME}}-Setup-{{.VERSION}}-x64.exe"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.BIN_DIR}}/{{.APP_NAME}}-Portable-{{.VERSION}}-x64.exe"
      - cd {{.BIN_DIR}} && sha256sum "{{.APP_NAME}}-Setup-{{.VERSION}}-x64.exe" > "{{.APP_NAME}}-Setup-{{.VERSION}}-x64.exe.sha256"
      - cd {{.BIN_DIR}} && sha256sum "{{.APP_NAME}}-Portable-{{.VERSION}}-x64.exe" > "{{.APP_NAME}}-Portable-{{.VERSION}}-x64.exe.sha256"

  parity:
    desc: Replay the scripted requests against the installed 2.7.x core and this one (§9.7).
    # Deliberately not part of `check`: it needs CodeFlow 2.7.x installed, which no CI runner has
    # and no new contributor should need. It is run by hand before a release, and its exit status
    # is the Phase 9 criterion — zero unexplained differences.
    cmds:
      - go run ./tools/parity {{.CLI_ARGS}}

  inventory:
    desc: Audit the Go tests against the C# suite they replace (§11 Phase 9 step 1).
    # Also out of `check`, and for a different reason from `parity`: it reports volume and location,
    # not a pass/fail. There is no threshold it could gate on that would mean anything — see the
    # command's doc comment.
    cmds:
      - go run ./tools/inventory {{.CLI_ARGS}}

  scripts:check:
    desc: Shellcheck the distribution scripts.
    # scripts/install-macos.sh is what the release page tells people to pipe into a shell, which
    # makes an unquoted expansion in it a user's problem rather than a maintainer's.
    cmds:
      - shellcheck scripts/*.sh

  check:
    desc: Everything the CI gate runs.
    cmds:
      - task: go:check
      - task: frontend:check
      - task: scripts:check
