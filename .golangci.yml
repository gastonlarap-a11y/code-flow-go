version: "2"

# golangci-lint v2 configuration.
#
# The set is chosen around the failure modes this port actually has, not around a "strict" label:
#
#   - errcheck / errorlint: the C# original handled errors at boundaries and the Go port has to do
#     the same explicitly. An ignored error here is a command that reports success and did nothing.
#   - bodyclose / noctx: every provider, work-item and update call goes through net/http. A leaked
#     body is a leaked connection in a process that runs for days.
#   - contextcheck: a Wails call's context is cancelled when the call returns (§3.7). Handing it to
#     an AI run or a stream connector would close the thing the moment it started.
#   - gosec: this process holds the user's tokens and spawns CLIs with their arguments.

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unparam
    - unused
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays off: this codebase's convention is that a deliberate `_ =` carries a
      # comment saying why the error cannot be acted on (a log write that must not fail the thing
      # it was recording, a best-effort cleanup). Flagging those would force a nolint on every one
      # and make the real signal — an error dropped silently — harder to see.
      check-blank: false
    govet:
      enable-all: true
      disable:
        # Struct field alignment is not worth reordering a wire-shaped struct for: the field order
        # of a response type mirrors the specification's table, which is how a reviewer checks it.
        - fieldalignment
        # `shadow` flags `if err := f(); err != nil` inside any function that already has an `err`,
        # which is ordinary Go and reads better than the alternatives. It is off by default in
        # govet for that reason; enable-all turned it on. Genuine shadowing bugs in this codebase
        # would be caught by the tests, since every shadowed value here is an error that is
        # checked on the next line.
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true # package comments carry the reasoning; per-symbol prefixes would repeat it
    misspell:
      # No locale on purpose. Forcing one turns every US/UK variant into a finding, and several of
      # those "misspellings" are byte contracts: `NOTHING_TO_ANALYZE: ` is a sentinel the renderer
      # matches with startsWith, and "correcting" it to ANALYSE would silently break a handled
      # state. Default catches real typos and leaves spelling variants alone.
      #
      # The rest are Spanish words this checker reads as misspelled English. They appear in
      # `VERBATIM` literals — the review markdown a person reads and every stored `review_runs` row
      # already carries them — so "correcting" one would rewrite history and break a parser at the
      # same time. Add a word here only when it is a Spanish literal the specification fixes.
      ignore-rules:
        - analyze
        - analyse
        - intencional # "es intencional", a finding dismissed as deliberate
        - revisiones # "### 📌 Siguen abiertos de revisiones anteriores" (REVIEW-040)
        - autor # "- Autor:" in a link review's PULL_REQUEST.md (REVIEW-009)
        - previos # "los commits previos de la rama", the SCOPE line (WI-023)
        - respondas # "Nunca respondas `no cumple`", the criteria caveat (WI-024)
        # The two `##` headers of XLANG-016 are accepted with and without their accents by both
        # parsers, and the unaccented spelling is what one of the fixtures pins.
        - VERIFICACION
        - ACEPTACION

  exclusions:
    paths:
      # `build/` holds packaging assets, and `wails3 generate build-assets` writes the Go in it —
      # dependency installers for the platform SDKs, and per-platform `main_*.go`. None of it is
      # this application's code, all of it is overwritten by the next `wails3 update build-assets`,
      # and linting it means either carrying someone else's style or editing files that will not
      # keep the edit. The app's own Go is `backend/`, `tools/` and `main.go`.
      - build/

    rules:
      # Tests may ignore errors from setup helpers and use weak randomness; they are not the
      # threat model, and requiring a check on every t.Setenv-adjacent call buries the assertions.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

      # The diagnostics writers swallow I/O failures on purpose: a full disk must not fail the
      # thing that was only being logged. Each site carries a justifying comment.
      - path: backend/diagnostics/
        linters:
          - errcheck

      # `KillTree` bounds its Windows fallback with a context of its own rather than taking the
      # caller's, and contextcheck reports that at every call site.
      #
      # Taking the caller's would be wrong here specifically: this runs on "stop this run" and on
      # shutdown, where the context that reached the caller is the one that was just cancelled.
      # Handing it to `exec.CommandContext` would kill `taskkill` the instant it started, which is
      # the opposite of making sure a process tree is gone. The 10-second bound is in
      # `group_windows.go` with the same reasoning.
      - text: KillTree->killTree
        linters:
          - contextcheck

formatters:
  enable:
    - gofmt
