<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    CodeFlow's mark: a block of diff with a spark on it.

    What the app does, in the order it does it — it reads a change and an agent reasons about it.
    The two added/removed bars carry the app's own success and danger tokens and the field is the
    accent gradient from `renderer/src/index.css`, so the icon belongs to the same palette as the
    window it launches. Three bars and one spark is all of it: anything finer disappears at 16px,
    which is the size this is read at most often.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#field)"/>

  <!-- The diff. Bar length varies so the block reads as code even with no glyphs in it. -->
  <g>
    <rect x="236" y="348" width="404" height="72" rx="36" fill="#4ade80"/>
    <rect x="236" y="476" width="292" height="72" rx="36" fill="#f87171"/>
    <rect x="236" y="604" width="356" height="72" rx="36" fill="#ffffff" fill-opacity="0.62"/>
  </g>

  <!-- The spark, sitting on the diff rather than beside it: the analysis is of the change. -->
  <g fill="url(#spark)">
    <path transform="translate(742 330) scale(126)"
          d="M0,-1 Q0.14,-0.14 1,0 Q0.14,0.14 0,1 Q-0.14,0.14 -1,0 Q-0.14,-0.14 0,-1 Z"/>
    <path transform="translate(846 470) scale(54)"
          d="M0,-1 Q0.14,-0.14 1,0 Q0.14,0.14 0,1 Q-0.14,0.14 -1,0 Q-0.14,-0.14 0,-1 Z"/>
  </g>
</svg>
