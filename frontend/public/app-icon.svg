<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The same mark as `shell/assets/icon.svg`, which is the master for the packaged bundle icons.
    Kept as its own file because this one is served to the browser as the favicon rather than
    rasterised at build time; edit both together or the tab and the Dock stop agreeing.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#field)"/>

  <g>
    <rect x="236" y="348" width="404" height="72" rx="36" fill="#4ade80"/>
    <rect x="236" y="476" width="292" height="72" rx="36" fill="#f87171"/>
    <rect x="236" y="604" width="356" height="72" rx="36" fill="#ffffff" fill-opacity="0.62"/>
  </g>

  <g fill="url(#spark)">
    <path transform="translate(742 330) scale(126)"
          d="M0,-1 Q0.14,-0.14 1,0 Q0.14,0.14 0,1 Q-0.14,0.14 -1,0 Q-0.14,-0.14 0,-1 Z"/>
    <path transform="translate(846 470) scale(54)"
          d="M0,-1 Q0.14,-0.14 1,0 Q0.14,0.14 0,1 Q-0.14,0.14 -1,0 Q-0.14,-0.14 0,-1 Z"/>
  </g>
</svg>
