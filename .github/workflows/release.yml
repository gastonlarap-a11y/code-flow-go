name: Release

# Builds the two installers and publishes them as a GitHub release (MIGRATION-GO.md §10.5).
#
# **This workflow is what 2.7.x users reach 3.0 through.** Its output is read by the updater already
# installed on their machines: `update_check` fetches `releases/latest` from this repository, picks
# the `.dmg` or the `-Setup-` `.exe`, and refuses anything whose `<asset>.sha256` is missing or does
# not match (BOOT-021). So three things here are contracts, not conventions:
#
#   - the artefact names, exactly as §5.5 fixes them — `-Setup-` is how the installer is told from
#     the portable build, and handing over the portable one updates nothing;
#   - a `.sha256` beside every artefact, written from inside the directory so the recorded name has
#     no path in it;
#   - the release is published **only after** both installers and all four digests are present. A
#     release that goes live half-uploaded is one every user's updater refuses.
#
# Publishing is deliberate: the run creates a *draft* and only the final job flips it live.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release when the build succeeds
        type: boolean
        default: false

# Never cancel a release in flight: a half-uploaded draft is worse than a duplicate run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for what it uses. `contents: write` is the release itself, and
# holding it in a job that only builds would hand it to every build script that job runs.
permissions: {}

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.20.0"
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  gate:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Write, although this job only reads: the API lists a *draft* release only to a token with push
    # access. With `read` the draft a failed run left behind reads as "absent", and the retry below
    # stops saying it is completing that draft.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version lives in three places and the updater compares against one of them. They are
      # required to agree here rather than discovered to disagree by a user whose update loops.
      - name: Read and reconcile the version
        id: read
        shell: bash
        run: |
          config=$(sed -n 's/^  productVersion: *"\(.*\)"/\1/p' build/config.yml)
          package=$(node -p "require('./frontend/package.json').version")

          if ! [[ "$config" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build/config.yml productVersion is '$config', not X.Y.Z"
            exit 1
          fi
          if [ "$config" != "$package" ]; then
            echo "::error::build/config.yml says $config and frontend/package.json says $package"
            exit 1
          fi

          echo "version=$config" >> "$GITHUB_OUTPUT"

          # A **published** release is not rebuilt: its assets are what users have been offered, and
          # replacing them under a published tag changes what a digest refers to.
          #
          # A draft is the opposite case and must not be confused with it. A draft is what a failed
          # run leaves behind — this one did, with only the macOS half uploaded — and refusing to
          # publish because that draft exists makes the retry a no-op, which is exactly how this
          # was found. So the test is `isDraft`, not existence.
          state=$(gh release view "v$config" --json isDraft --jq '.isDraft' 2>/dev/null || echo "absent")
          if [ "$state" = "false" ]; then
            echo "v$config is already published; building without publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            [ "$state" = "true" ] && echo "v$config exists as a draft; this run will complete it"
            echo "publish=$PUBLISH_REQUESTED" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}

  draft:
    name: Draft
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Created only when there is none. A draft left by a failed run is reused rather than fought
      # over: `gh release create` fails outright on an existing tag, which would turn every retry
      # into a failure at its first step.
      - name: Create the draft release
        run: |
          version="v$RELEASE_VERSION"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already exists as a draft; reusing it"
            exit 0
          fi
          gh release create "$version" \
            --draft --target "$GITHUB_SHA" \
            --title "$version" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  installers:
    name: Installer (${{ matrix.os }})
    needs: [gate, draft]
    # `always()` so a skipped draft (an existing release) still builds: the artefacts are worth
    # having even when nothing will be published.
    if: always() && needs.gate.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # uploading to the draft
      id-token: write # the OIDC token Sigstore signs the provenance with
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      PACKAGE_TASK: ${{ matrix.task }}
    strategy:
      fail-fast: false # one platform's failure must not hide the other's
      matrix:
        include:
          - os: macos-15
            task: package:mac:dmg
            installers: bin/CodeFlow-*-arm64.dmg
          - os: windows-2025
            task: package:win
            installers: bin/CodeFlow-*-x64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The CLI's version is read from go.mod rather than written here: the CLI, the library it
      # packages and `@wailsio/runtime` have to be the same beta, and a second copy of the number is
      # one that drifts. Not a `tool` directive, which would put the CLI's ~140 dependencies in
      # go.mod for a program the app never links.
      - name: Install the Wails CLI
        shell: bash
        run: |
          wails=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails"

      # The installer is built with NSIS, and windows-2025 does not ship it — the first release run
      # failed with `"makensis": executable file not found in $PATH` after building everything else.
      # Chocolatey is preinstalled on the image; NSIS puts `makensis` here and does not add it to
      # PATH itself.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the renderer's dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Package
        shell: bash
        run: wails3 task "$PACKAGE_TASK" VERSION="$RELEASE_VERSION"

      # The packaged binary answers "is this viable on this machine?" and exits. A build that
      # cannot probe its own environment is not one to upload.
      - name: Smoke-test what was built
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./bin/CodeFlow.exe --smoke-test
          else
            ./bin/CodeFlow.app/Contents/MacOS/CodeFlow --smoke-test
          fi

      - name: Check the artefact names and digests
        shell: bash
        run: |
          cd bin
          version="$RELEASE_VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            expected=("CodeFlow-Setup-$version-x64.exe" "CodeFlow-Setup-$version-x64.exe.sha256" \
                      "CodeFlow-Portable-$version-x64.exe" "CodeFlow-Portable-$version-x64.exe.sha256")
          else
            expected=("CodeFlow-$version-arm64.dmg" "CodeFlow-$version-arm64.dmg.sha256")
          fi
          for name in "${expected[@]}"; do
            [ -f "$name" ] || { echo "::error::$name was not produced"; exit 1; }
          done
          # A digest recorded with a path in it is the v1.7.5 failure in a different shape: the
          # updater matches the last path segment, so a recorded `bin/CodeFlow…` still matches —
          # but a single-entry file is trusted without matching at all, so this checks the content
          # is a digest and a bare name rather than trusting either rule.
          for name in *.sha256; do
            grep -qE '^[0-9a-f]{64} [ *][^/\\]+$' "$name" || {
              echo "::error::$name is not '<64 hex>  <bare name>'"; cat "$name"; exit 1; }
          done

      # The installer script's whole promise is that what it puts in /Applications carries no
      # quarantine flag, whatever the disk image it started from carried — that is what spares the
      # user the "Apple could not verify" refusal on an unnotarized build. Proven here, against the
      # image about to be published, on a copy marked exactly the way a browser marks a download.
      #
      # It also checks the bundle's own version, which is the other half of the same promise: the
      # Info.plist shipped 3.0.0 for every release up to 3.3.0, so Get Info on a bundle macOS had
      # just called suspicious named a version the user had never downloaded.
      - name: Smoke-test the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          name="CodeFlow-$version-arm64.dmg"

          staging="$RUNNER_TEMP/staging"
          mkdir -p "$staging"
          cp "bin/$name" "bin/$name.sha256" "$staging/"
          xattr -w com.apple.quarantine "0081;00000000;Chrome;" "$staging/$name"

          CODEFLOW_DMG="$staging/$name" bash scripts/install-macos.sh --prefix "$RUNNER_TEMP/apps"

          app="$RUNNER_TEMP/apps/CodeFlow.app"
          [ -d "$app" ] || { echo "::error::the installer produced no bundle"; exit 1; }
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "::error::the installed bundle is quarantined; the installer's reason to exist is gone"
            exit 1
          fi
          got=$(defaults read "$app/Contents/Info" CFBundleShortVersionString)
          [ "$got" = "$version" ] || {
            echo "::error::the bundle declares $got, not $version"; exit 1; }

      # A signed SLSA provenance statement per installer: which commit and which workflow run built
      # it, checkable with `gh attestation verify <file> --repo gastonlarap-a11y/code-flow-go`.
      #
      # Beside the `.sha256`, never instead of it. The digest proves the download is the file the
      # release lists and is what every installed updater checks (BOOT-021); this proves where that
      # file came from, for a person who asks. Nothing reads it automatically, so it changes no
      # contract. Only for a run that publishes, so a trial build leaves no statement behind.
      - name: Attest build provenance
        if: needs.gate.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.installers }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ runner.os }}
          path: |
            bin/*.dmg
            bin/*.exe
            bin/*.sha256
          if-no-files-found: error

      # By name, not by glob. `ls *.exe` also matches `bin/CodeFlow.exe` — the raw build output the
      # installer is made *from* — and v3.0.0 went out with 55 MB of it attached, offered to every
      # user beside the three artefacts that mean something. The names are already fixed by §5.5 and
      # already checked above, so listing them is not duplication: it is the same contract, used.
      - name: Upload to the draft release
        if: needs.gate.outputs.publish == 'true'
        shell: bash
        run: |
          cd bin
          version="$RELEASE_VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            names=("CodeFlow-Setup-$version-x64.exe" "CodeFlow-Portable-$version-x64.exe")
          else
            names=("CodeFlow-$version-arm64.dmg")
          fi
          gh release upload "v$version" "${names[@]}" "${names[@]/%/.sha256}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: [gate, installers]
    if: needs.gate.outputs.publish == 'true' && needs.installers.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The last gate before every installed 2.7.x starts offering this release. Four assets, by
      # the patterns the updater itself selects on — not by count, because four files of the wrong
      # kind would pass a count.
      - name: Require every asset the updater needs
        shell: bash
        run: |
          assets=$(gh release view "v$RELEASE_VERSION" --json assets --jq '.assets[].name')
          echo "$assets"
          for pattern in '\.dmg$' '\.dmg\.sha256$' '\-Setup\-.*\.exe$' '\-Setup\-.*\.exe\.sha256$'; do
            echo "$assets" | grep -qE "$pattern" || {
              echo "::error::no asset matches $pattern; refusing to publish"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # Every download of an unsigned build is refused by the operating system on its first launch,
      # and the release page is the only place anybody looks for why. Prepended rather than
      # replacing, so the generated changelog survives.
      #
      # `{{VERSION}}` is substituted rather than written into the file: the preamble's install
      # commands name the artefact, and an example carrying the *previous* release's version is one
      # nobody can paste.
      - name: Explain the first launch
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          body=$(gh release view "v$version" --json body --jq .body)
          preamble=$(sed "s/{{VERSION}}/$version/g" .github/release-preamble.md)
          printf '%s\n\n%s\n' "$preamble" "$body" > notes.md
          gh release edit "v$version" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish
        run: |
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
