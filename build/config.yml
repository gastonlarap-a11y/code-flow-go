# wails3 build configuration.
#
# The identity here is not cosmetic: CodeFlow 3.0 is a drop-in replacement for 2.7.x, and three of
# these values are what make an upgrade keep the user's data rather than start beside it.
#
#   - identifier `com.codeflow.app` is the bundle id 2.x shipped, the single-instance UniqueID in
#     main.go, and the macOS keychain service name every stored token is filed under. Changing it
#     makes every saved credential unreadable and lets two CodeFlows run at once.
#   - productName `CodeFlow` is the .app name Finder replaces on a drag-install, and the NSIS
#     display name the Windows uninstaller matches on.
#   - version is the number the updater compares against the GitHub release feed. The CI gate
#     requires this, frontend/package.json and the -ldflags value to agree.
#
# The minimum macOS is 26.0 (Tahoe). Apple stopped patching macOS 14 Sonoma in September 2026, and
# every supported version from 15 up ships Safari 26+ — which is what lets the renderer use CSS
# anchor positioning, the Popover API and light-dark() with no fallback path. See README.

info:
  productName: CodeFlow
  productIdentifier: com.codeflow.app
  description: Code review and API workbench
  productVersion: "3.8.0"
  productCompany: Gastón Lara P.
  productCopyright: © 2026 Gastón Lara P.
  productComments: Code review and API workbench

# What `wails3 dev` watches and runs. Written by hand in the schema the CLI reads today
# (`root_path`, `ignore`, `executes`); the earlier `frontend.dir`/`dev_url` block was a schema the
# CLI no longer reads, which left `root_path` empty and failed every run with "root path is
# required".
#
# The commands are this repository's own `dev:*` tasks, not the generator's
# `common:dev:frontend`/`run`: the root Taskfile deliberately does not include the generated build
# tasks (see its header). The Vite port lives in `task dev`, which passes it as `-port`.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .pnpm-store
      - bin
      - build
      - docs
      - frontend # Vite reloads the renderer itself
      - node_modules
    file:
      - .DS_Store
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task dev:run
      type: primary
      exit_policy: shutdown
